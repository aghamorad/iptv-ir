name: build

on:
  schedule:
    # 03:20 Tehran (00:50 UTC) -- off-peak, and before the box is usually on.
    - cron: "50 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py, .github/workflows/build.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and verify every channel
        run: python3 build.py
      - name: Commit the playlist if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ir.m3u
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "rebuild: $(date -u +%Y-%m-%d)"
            git push
          fi
